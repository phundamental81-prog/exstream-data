name: Build the streaming-service list

on:
  schedule:
    - cron: '17 6 * * *' # every day, 06:17 UTC (the app only downloads it when it changed)
  workflow_dispatch: # the "Run workflow" button

permissions:
  contents: write # to save services.json back into this repository

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask Wikidata
        run: node build.mjs
      - name: Save the list (only when it changed)
        run: |
          git config user.name "exstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services.json views.json
          git diff --cached --quiet || (git commit -m "Daily streaming-service list" && git push)
